[SERVICE]
    Flush         1
    Log_Level     info
    Daemon        off
    Parsers_File  parsers.conf

[INPUT]
    Name          forward
    Listen        0.0.0.0
    Port          24224
    Tag           tex

[INPUT]
    Name          tcp
    Listen        0.0.0.0
    Port          24225
    Format        json
    Tag           tex-local

[FILTER]
    Name          lua
    Match         *
    script        extract_env.lua
    call          extract_env

[OUTPUT]
    Name                opensearch
    Match               *
    Host                opensearch
    Port                9200
    Logstash_Format     On
    Logstash_Prefix_Key _logstash_prefix
    Time_Key            @timestamp
    Type                _doc
    Suppress_Type_Name  On
    Include_Tag_Key     On
    Tag_Key             tag
    Generate_ID         On
    Replace_Dots        Off
    Retry_Limit         5

[OUTPUT]
    Name          stdout
    Match         *
    Format        json_lines
